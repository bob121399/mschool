# Hosted DEMO (synthetic data only) on Render: Next.js web + durable worker, native Node runtime.
# Database/Auth/Storage: a dedicated Supabase project for the demo (never the production project).
# Setup and values: docs/demo-hosting.md (secrets are set by scripts/demo/hosted-setup.sh or in the dashboard).
services:
  - type: web
    name: mschool-demo
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: mvp-iteration-02
    autoDeployTrigger: commit
    buildCommand: npm ci --no-audit --no-fund && npm run build && npm run check:bundle
    startCommand: bash scripts/start-standalone.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME_BIND
        value: 0.0.0.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: MSCHOOL_DEMO_MODE
        value: "true"
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: APP_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TUTOR_MODEL
        sync: false
      - key: OPENAI_ASSESSOR_MODEL
        sync: false
      - key: OPENAI_WORKER_MODEL
        sync: false

  - type: worker
    name: mschool-demo-worker
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: mvp-iteration-02
    autoDeployTrigger: commit
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run worker:start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_WORKER_MODEL
        sync: false
